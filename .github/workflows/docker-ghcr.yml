name: Build, Test and Push to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: student-result-prediction

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Build image
        run: docker build -t $IMAGE:test .

      - name: Container health test
        run: |
          docker run -d --name srp -p 8000:8000 $IMAGE:test
          for i in $(seq 1 20); do
            curl --fail --silent http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs srp
          exit 1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          docker tag $IMAGE:test $IMAGE:latest
          docker tag $IMAGE:test $IMAGE:sha-${GITHUB_SHA::7}
          docker push $IMAGE:latest
          docker push $IMAGE:sha-${GITHUB_SHA::7}
